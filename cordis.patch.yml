# dsh-plugin-documd 的 bundle 配置层：装进 profile 后生效。
# 行 id 就是宿主派生 settings 命名空间时用的 id，也是客户端配置页的键，三处必须一致。
- insert:
    - id: dsh-plugin-documd
      name: dsh-plugin-documd
      config:
        # viewer 允许读取的工作区根目录；留空时以宿主进程的当前目录为准。
        # 多个根目录用 `;` 分隔。所有读取都会 realpath 后校验落在这个根内。
        workspaceRoot: ''
        # 初始主题：auto（跟随 dsh 明暗）、vscode、vscode-dark 或任意 themes/registry.json 里的 id。
        themeId: auto
        # 单文件预览上限（字节）。超过时返回明确的“文件过大”提示，而不是静默失败。
        maxPreviewBytes: 8388608
        # 每个标签页签发的能力令牌有效期（毫秒）；关闭标签页时立即吊销。
        tokenTtlMs: 600000
