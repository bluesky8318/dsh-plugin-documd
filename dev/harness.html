<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dsh-plugin-documd · dev harness</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #1f2328;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      font-size: 13px;
      border-bottom: 1px solid #d6d9dd;
      background: #f6f8fa;
    }
    header code { font-size: 12px; opacity: 0.75; }
    .badge {
      margin-left: auto;
      padding: 2px 10px;
      border-radius: 999px;
      background: #dbe9ff;
      color: #0b4f9e;
      font-variant-numeric: tabular-nums;
    }
    body[data-state="rendered"] .badge { background: #d7f5e2; color: #11653b; }
    body[data-state="error"] .badge { background: #ffdcdc; color: #a11212; }
    #pane { flex: 1; position: relative; min-height: 0; }
    .frame { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    @media (prefers-color-scheme: dark) {
      body { background: #0d1117; color: #e6edf3; }
      header { background: #161b22; border-color: #30363d; }
      .badge { background: #12365f; color: #9dcbff; }
    }
  </style>
</head>
<body data-state="boot">
  <header>
    <strong>dsh-plugin-documd</strong>
    <code id="address">dsh-resource://file/session/dev/sample/demo.md</code>
    <span class="badge" id="badge">booting…</span>
  </header>
  <div id="pane"></div>

  <script>
    const ADDRESS = 'dsh-resource://file/session/dev/sample/demo.md';
    const badge = document.getElementById('badge');
    const pane = document.getElementById('pane');

    function setState(state, text) {
      document.body.dataset.state = state;
      badge.textContent = text;
    }

    async function readJson(url, init) {
      const response = await fetch(url, init);
      const body = await response.json();
      if (!response.ok) throw new Error(`${response.status} ${body.error || ''} ${body.message || ''}`.trim());
      return body;
    }

    async function main() {
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;

      setState('session', 'issuing session…');
      const session = await readJson('/docu-preview/api/session', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ address: ADDRESS, dark }),
      });
      document.body.dataset.category = session.category;

      setState('reading', 'reading document…');
      const file = await readJson(`/docu-preview/api/file?token=${encodeURIComponent(session.token)}`);

      const frame = document.createElement('iframe');
      frame.className = 'frame';
      frame.title = session.filename;
      frame.src = `/docu-preview/viewer/index.html?token=${encodeURIComponent(session.token)}&theme=${encodeURIComponent(session.themeId)}`;

      let delivered = false;
      function deliver() {
        if (delivered || !frame.contentWindow) return;
        delivered = true;
        const slash = session.path.lastIndexOf('/');
        frame.contentWindow.postMessage({
          type: 'OPEN_DOCUMENT',
          content: file.content,
          filename: session.filename,
          fileDir: slash >= 0 ? session.path.slice(0, slash + 1) : '',
          targetLine: 1,
        }, window.location.origin);
      }

      window.addEventListener('message', (event) => {
        if (event.source !== frame.contentWindow) return;
        const message = event.data || {};
        if (message.type === 'VIEWER_READY') {
          setState('ready', 'viewer ready');
          deliver();
        } else if (message.type === 'VIEWER_RENDERED') {
          setState('rendered', `rendered ${message.filename}`);
          document.body.dataset.renderedFilename = String(message.filename || '');
        } else if (message.type === 'VIEWER_ERROR') {
          setState('error', `error: ${message.message}`);
        } else if (message.type === 'VIEWER_SCROLL_LINE_CHANGED') {
          document.body.dataset.scrollLine = String(message.line);
        } else if (message.type === 'WORKSPACE_NAVIGATE') {
          badge.textContent = `navigate → ${message.path}`;
        } else if (message.type === 'OPEN_URL') {
          badge.textContent = `open url → ${message.url}`;
        }
      });

      frame.addEventListener('load', deliver);
      pane.appendChild(frame);
    }

    main().catch((error) => setState('error', `error: ${error.message || error}`));
  </script>
</body>
</html>
